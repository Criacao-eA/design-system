<!-- Redireciona para o catálogo. Existe porque o GitHub Pages serve index.html na raiz,
     e o entregável se chama catalogo.html. O refresh é a rede de segurança: se o
     JavaScript estiver desligado, ele leva do mesmo jeito. -->
<meta http-equiv="refresh" content="0; url=./catalogo.html">
<link rel="canonical" href="./catalogo.html">
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:#eef2f9;color:#0b0d2e;
    font-family:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif}
  @media (prefers-color-scheme:dark){body{background:#05061c;color:#eef0ff}}
  .caixa{text-align:center;padding:32px}
  h1{font-family:'Familjen Grotesk','Segoe UI',system-ui,sans-serif;
    font-weight:700;letter-spacing:-.02em;font-size:1.5rem;margin:0 0 8px}
  p{margin:0 0 20px;font-size:.95rem;opacity:.72}
  a{display:inline-block;background:#FEC008;color:#050634;text-decoration:none;
    font-weight:700;font-size:.95rem;padding:14px 28px;border-radius:100px}
  a:hover{transform:translateY(-2px)}
  a{transition:transform .2s cubic-bezier(.16,1,.3,1)}
  .marca{white-space:nowrap}
</style>
</head>
<body>
  <div class="caixa">
    <h1>Design System <span class="marca">e-Auditoria</span></h1>
    <p>Levando você para o catálogo…</p>
