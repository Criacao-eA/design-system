<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" role="img" aria-label="Padrao e-Auditoria: grade de pontos com cruzes a cada 4 pontos">
  <defs>
    <pattern id="ea-padrao-pontos-base" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.1" fill="currentColor"/>
    </pattern>
    <pattern id="ea-padrao-cruzes" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M10 4.5v11M4.5 10h11" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </pattern>
  </defs>
  <rect width="480" height="480" fill="url(#ea-padrao-pontos-base)"/>
  <rect width="480" height="480" fill="url(#ea-padrao-cruzes)"/>
</svg>
